<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1720" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Architettura generale di Storycast AI Qdrant</title><desc id="desc">Browser e file sul computer host. Nell’ambiente Compose, FastAPI e l’indicizzatore Python usano ciascuno E5 sulla CPU e si collegano a PostgreSQL e Qdrant.</desc>
