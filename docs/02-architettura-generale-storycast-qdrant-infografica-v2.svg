<use href="#i-web" x="823" y="421" width="49" height="49" color="#147b29"/>
<text x="883" y="445" class="head" >FastAPI</text>
<text x="883" y="466" class="small b" >Container web</text>
<text x="826" y="491" class="small" >Serve pagina, catalogo e ricerca.</text>
<text x="826" y="512" class="small" >Legge da PostgreSQL il percorso video</text>
<text x="826" y="533" class="small" >e trasmette al browser il video disponibile.</text>
<rect x="825" y="584" width="312" height="103" rx="13" fill="url(#orange)" stroke="#ed9410" stroke-width="2"/>
<use href="#i-cpu" x="837" y="598" width="44" height="44" color="#b95900"/>
<text x="892" y="612" class="head" style="font-size:20px">Modello E5 su CPU</text>
<text x="892" y="636" class="small" >intfloat/multilingual-e5-small</text>
<text x="839" y="664" class="small" >Converte la domanda in un vettore.</text>
