<use href="#i-cpu" x="75" y="598" width="44" height="44" color="#b95900"/>
<text x="130" y="612" class="head" style="font-size:20px">Modello E5 su CPU</text>
<text x="130" y="636" class="small" >intfloat/multilingual-e5-small</text>
<text x="77" y="664" class="small" >Converte i frammenti in vettori.</text>
