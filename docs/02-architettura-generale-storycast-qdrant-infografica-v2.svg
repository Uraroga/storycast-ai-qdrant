<text x="164" y="51" class="caps pale" >STORYCAST AI QDRANT</text>
<text x="162" y="93" class="light" font-size="37" font-weight="800" letter-spacing="-.8">Architettura generale di Storycast AI Qdrant</text>
<text x="164" y="122" class="light body" >Dal browser ai servizi Docker, ai file Storycast e ai due database.</text>
<rect x="48" y="165" width="342" height="102" rx="17" fill="url(#blue)" stroke="#0783e8" stroke-width="2"/>
<use href="#i-txt" x="61" y="176" width="49" height="49" color="#0759b6"/>
