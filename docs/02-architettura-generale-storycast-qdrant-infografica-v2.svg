<use href="#i-db" x="475" y="427" width="49" height="49" color="#0759b6"/>
<text x="535" y="451" class="head" >PostgreSQL</text>
<text x="478" y="486" class="small" >Conserva episodi, testi, metadati</text>
<text x="478" y="507" class="small" >e riferimenti ai video.</text>
<rect x="462" y="622" width="276" height="125" rx="17" fill="url(#purple)" stroke="#9245e9" stroke-width="2"/>
<use href="#i-vec" x="475" y="633" width="49" height="49" color="#641bbc"/>
<text x="535" y="657" class="head" >Qdrant</text>
<text x="478" y="692" class="small" >Conserva l’indice dei vettori,</text>
<text x="478" y="713" class="small" >collegati all’ID dell’episodio.</text>
