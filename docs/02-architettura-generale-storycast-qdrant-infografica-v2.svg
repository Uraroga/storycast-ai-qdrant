<text x="121" y="466" class="small b" >Container temporaneo</text>
<text x="64" y="491" class="body" >Pulisce i TXT e verifica i video</text>
<text x="64" y="512" class="body" >nella cartella output e aggiorna</text>
<text x="64" y="533" class="body" >il catalogo e l’indice vettoriale.</text>
