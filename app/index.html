<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storycast · Ricerca e catalogo</title>
<style>
body{font:18px system-ui;max-width:850px;margin:40px auto;padding:20px;background:#f5f6fa;color:#182238}
input{min-width:0;flex:1;padding:12px;font:inherit}button,.video-link{padding:12px;font:inherit;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:10px}article{background:white;padding:24px;margin:20px 0;border-radius:12px;overflow-wrap:anywhere}
a{color:#1749b4}small{color:#536079}.video-link{display:inline-block;border:1px solid;border-radius:6px;margin-top:12px}
button:disabled{cursor:wait}#pagination{display:flex;flex-wrap:wrap;align-items:center;gap:12px}[hidden]{display:none!important}
</style>
<h1>Storycast</h1>
<form id="form"><label for="q">Che cosa vuoi imparare?</label><p class="actions"><input id="q" required maxlength="1000" placeholder="Come isolare le applicazioni?"> <button type="submit">Cerca</button><button type="button" id="catalog">Mostra tutti gli episodi</button></p></form>
<section id="catalog-heading" hidden><h2>Catalogo completo</h2><p>Tutti gli episodi PostgreSQL, dal più recente inserimento per ID. Nessuna ricerca semantica.</p><button type="button" id="back">Torna alla ricerca</button></section>
<p id="status" role="status" aria-live="polite"></p><main id="results" aria-label="Episodi"></main>
<nav id="pagination" aria-label="Pagine del catalogo" hidden><button type="button" id="previous">Pagina precedente</button><span id="page"></span><button type="button" id="next">Pagina successiva</button></nav>
<script>
const form=document.querySelector('#form'), statusEl=document.querySelector('#status'), results=document.querySelector('#results');
const catalogButton=document.querySelector('#catalog'), heading=document.querySelector('#catalog-heading'), pagination=document.querySelector('#pagination');
const previous=document.querySelector('#previous'), next=document.querySelector('#next'), page=document.querySelector('#page'), back=document.querySelector('#back');
let controller, requestId=0, catalogMode=false, cursor=null, history=[], nextCursor=null;
function beginRequest(){if(controller)controller.abort();controller=new AbortController();const id=++requestId;for(const b of [form.querySelector('button[type=submit]'),catalogButton,previous,next])b.disabled=true;results.setAttribute('aria-busy','true');return {id,signal:controller.signal};}
function finishRequest(id){if(id!==requestId)return;form.querySelector('button[type=submit]').disabled=false;catalogButton.disabled=false;previous.disabled=history.length===0;next.disabled=nextCursor===null;results.removeAttribute('aria-busy');}
function setView(catalog){catalogMode=catalog;form.hidden=catalog;heading.hidden=!catalog;pagination.hidden=true;results.replaceChildren();}
function render(items,semantic){results.replaceChildren();for(const item of items){const article=document.createElement('article'),title=document.createElement('h2');title.textContent='ID '+item.id+' · '+item.title;article.append(title);if(item.description){const p=document.createElement('p');p.textContent=item.description;article.append(p);}if(semantic){const score=document.createElement('small');score.textContent='Affinità: '+item.score.toFixed(3)+' · non è una probabilità';article.append(score,document.createElement('br'));}if(item.video_url){const link=document.createElement('a');link.href=item.video_url;link.className='video-link';link.textContent='▶ Riproduci video';article.append(link);}else{const missing=document.createElement('p');missing.textContent='Video non disponibile';article.append(missing);}results.append(article);}}
async function loadCatalog(newCursor=null,newHistory=[]){const {id,signal}=beginRequest();setView(true);statusEl.textContent='Caricamento catalogo…';try{let url='/episodes?limit=20';if(newCursor!==null)url+='&before_id='+encodeURIComponent(newCursor);const r=await fetch(url,{signal});if(!r.ok)throw Error('Catalogo non disponibile. Controllare PostgreSQL.');const data=await r.json();if(id!==requestId)return;cursor=newCursor;history=newHistory;nextCursor=data.next_before_id;render(data.episodes,false);statusEl.textContent='Totale catalogo: '+data.total+' episodi · '+data.episodes.length+' in questa pagina';page.textContent='Pagina '+(history.length+1);pagination.hidden=data.total===0;}catch(err){if(id===requestId&&err.name!=='AbortError'){statusEl.textContent=err.message;pagination.hidden=true;}}finally{finishRequest(id);}}
catalogButton.addEventListener('click',()=>loadCatalog());
next.addEventListener('click',()=>{if(nextCursor!==null)loadCatalog(nextCursor,[...history,cursor]);});
previous.addEventListener('click',()=>{if(history.length)loadCatalog(history[history.length-1],history.slice(0,-1));});
back.addEventListener('click',()=>{if(controller)controller.abort();const id=++requestId;setView(false);statusEl.textContent='Inserisci una domanda per la ricerca semantica.';finishRequest(id);document.querySelector('#q').focus();});
form.addEventListener('submit',async e=>{e.preventDefault();const {id,signal}=beginRequest();setView(false);statusEl.textContent='Ricerca in corso… La prima ricerca può richiedere il caricamento del modello.';try{const r=await fetch('/search?q='+encodeURIComponent(document.querySelector('#q').value),{signal});if(!r.ok)throw Error('Ricerca non disponibile. Controllare i servizi.');const data=await r.json();if(id!==requestId)return;statusEl.textContent=data.results.length+' episodi trovati';render(data.results,true);}catch(err){if(id===requestId&&err.name!=='AbortError')statusEl.textContent=err.message;}finally{finishRequest(id);}});
</script></html>
