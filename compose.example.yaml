# Modello pubblico per una NUOVA installazione; copiare in compose.yaml.
services:
  postgres:
    image: postgres@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant@sha256:d18c8e5061be3eaea2f53fbee1f0bf0382dc59cbb9b7112e41ffcc937ec14220
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 2g
    cpus: 1.0

    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r line <&3; [[ $$line == *'200 OK'* ]]"]
      interval: 30s
      timeout: 5s
      retries: 5

  web: &app
    build: .
    image: storycast-search:1.0
    restart: unless-stopped
    env_file: .env
    environment:
      HF_HOME: /cache/huggingface
      MODEL_REVISION: 614241f622f53c4eeff9890bdc4f31cfecc418b3
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      WEB_ALLOWED_NETWORKS: "${WEB_ALLOWED_NETWORKS:-127.0.0.0/8,::1/128}"
    volumes:
      - model_cache:/cache
      - ${STORYCAST_ROOT:?Impostare STORYCAST_ROOT in .env}/input:/storycast/input:ro
      - ${STORYCAST_ROOT:?Impostare STORYCAST_ROOT in .env}/output:/storycast/output:ro
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    mem_limit: 3g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  indexer:
    <<: *app
    profiles: [tools]
    restart: "no"
    ports: []
    command: ["python", "-m", "app.indexer"]
    healthcheck:
      disable: true

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
